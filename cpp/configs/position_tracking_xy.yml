motion_enabled: true

realtime_enforced: false

require_tracker_source_filter: true
stop_on_tracking_loss: true
stop_on_robot_contact: true
worker_rate_hz: 100.0

# ---------------------------------------------------------------------------
# Gradual axis enable
# ---------------------------------------------------------------------------
