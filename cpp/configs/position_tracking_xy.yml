tracking_loss_grace_s: 0.750
command_timeout_s: 0.050
arm_valid_packets: 5
max_arm_wait_s: 15.0
max_motion_runtime_s: 0.0
max_stop_time_s: 2.0

# ---------------------------------------------------------------------------
# Incoming tracker filter
# ---------------------------------------------------------------------------
