# Runtime safety gates for cpp/src/pbvs_robot.cpp
# Flat key:value YAML on purpose: pbvs_robot.cpp parses this file without
# adding a yaml-cpp dependency.
#
# FIRST-RUN WORKFLOW:
#   1) Leave motion_enabled: false and run pbvs_observer until PBVS is stable.
#   2) Verify translation-only behaviour and frame directions.
#   3) Set motion_enabled: true.
#   4) pbvs_robot STILL requires --enable-motion on the command line.

motion_enabled: false
translation_only: true
require_tracker_source_filter: true

# Stop the libfranka motion generator if it cannot arm in this time.
max_arm_wait_s: 15.0

# Stop the motion generator after this total runtime.
max_runtime_s: 10.0

# Independent hard caps in addition to pbvs_robot.json.
hard_max_linear_speed_mps: 0.010
hard_max_command_lead_m: 0.002
hard_max_position_error_m: 0.080
hard_max_tracker_age_s: 0.120
# PBVS thread -> 1 kHz control-loop watchdog.
max_command_age_s: 0.050

# Require PBVS to remain continuously in TRACKING before motion starts.
# At 100 Hz, 20 cycles = about 0.2 s after the PBVS controller itself arms.
arm_tracking_cycles: 20

# libfranka communication watchdog.
min_control_command_success_rate: 0.95
communication_grace_s: 0.50

# If PBVS leaves TRACKING after motion has armed, terminate the control loop.
stop_on_tracking_loss: true

# For the first robot test, orientation commands are forbidden even if the
# PBVS config is accidentally changed to control_orientation=true.
allow_orientation_motion: false
